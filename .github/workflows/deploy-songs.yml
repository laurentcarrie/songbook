name: Deploy Songs to S3

# On every push to main (a merged pull request):
#   1. mirror songs/, books/ and drums/ to the prod bucket (the mp3 there are left alone: they are not in git),
#   2. check that the mp3 in the bucket match the songs in git,
#   3. build everything on the runner, like `make all` on a dev machine: lilypond, lualatex, fluidsynth + ffmpeg
#      (the mp3 renders), band-songbook from crates.io. The band-songbook Lambda cannot do it: 15 minutes at most
#      and no fluidsynth/ffmpeg/soundfont in its image,
#   4. upload the delivery to the bucket and re-index the site,
#   5. pack the delivery in the 3 tarballs of the app (delivery-pdf, delivery-mp3, delivery-mp3-renders) and
#      upload them next to it: `make prod-tarballs`, the packing and upload part of `make upload-prod-tarball`.
#
# Secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, BUCKET, WRITE_PASSWORD (the prod write password).

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-songs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BUCKET: ${{ secrets.BUCKET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      # Not `make upload-prod`: it deletes songs/ on S3 and uploads it again, mp3 included, and the CI
      # checkout has no mp3 (they are gitignored): its check-mp3 refuses, with 27 audio files at stake.
      - name: Upload songs, books and drums to prod
        run: make upload-prod-sources

      # The mp3 come from `make upload-mp3-prod` on a dev machine, nothing in the CI produces them: fail here, before
      # the long build, if one is missing or left over from a deleted song.
      - name: Check the mp3 in the prod bucket
        run: make check-prod-mp3

      - name: Install the toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-luatex texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-fonts-extra \
            texlive-lang-french texlive-plain-generic lilypond fluidsynth fluid-soundfont-gm ffmpeg fontconfig
          lilypond --version | head -1

      # The chord fonts live in the songbook-lambda repo (public); `make install` there does not install them.
      - name: Checkout the songbook fonts
        uses: actions/checkout@v4
        with:
          repository: laurentcarrie/songbook-lambda
          path: songbook-lambda
          sparse-checkout: band-songbook/fonts

      - name: Install the songbook fonts
        run: |
          mkdir -p ~/.fonts
          find songbook-lambda/band-songbook/fonts \( -name '*.ttf' -o -name '*.otf' \) -size +0 -exec cp {} ~/.fonts/ \;
          fc-cache -f
          fc-list | grep -ci songbook

      # From the main branch of songbook-lambda, not crates.io: the crate is only published when its version is
      # bumped, and 7sus4 (G7sus4 in classique/bach) was merged without a bump. A new commit there rebuilds it.
      - name: Find the latest band-songbook commit
        id: version
        run: echo "sha=$(git ls-remote https://github.com/laurentcarrie/songbook-lambda refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Cache band-songbook
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/band-songbook
          key: band-songbook-${{ steps.version.outputs.sha }}

      - name: Install band-songbook
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/laurentcarrie/songbook-lambda --rev "${{ steps.version.outputs.sha }}" band-songbook

      # The audio the build needs (delivery/mp3, the clicks, the mp3 renders): checked above, uploaded by hand.
      - name: Download the mp3 from the prod bucket
        run: make download-prod-mp3

      - name: Build all the songs and books
        run: |
          band-songbook --version || true
          make all

      - name: Upload the delivery to prod
        run: make upload-prod-delivery

      - name: Re-index the site
        run: make reindex URL=move-the-line.org
        env:
          WRITE_PASSWORD: ${{ secrets.WRITE_PASSWORD }}

      - name: Pack and upload the tarballs
        run: make prod-tarballs
