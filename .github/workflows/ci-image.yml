name: Build the CI image

# Builds docker/ci/Dockerfile and pushes it to ghcr.io/laurentcarrie/songbook-ci, the container of the deploy job.
# Only when the Dockerfile changes (or by hand): the deploy job installs band-songbook and the chord fonts itself.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/ci/**'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # On the ubuntu-26.04 runner /etc/resolv.conf points at the local stub 127.0.0.53: BuildKit drops it from the
      # resolv.conf of the build containers and falls back to public DNS servers, which the runner does not reach,
      # so `apt-get update` fails with "Temporary failure resolving 'archive.ubuntu.com'" (the registries resolve, the
      # host too). Tell Docker which servers to use, the upstream ones of the host (and the Azure one), as one does
      # on a dev machine in /etc/docker/daemon.json. --network host did not help: same generated resolv.conf.
      - name: Give Docker a DNS server
        run: |
          ns=$(awk '/^nameserver/ {print $2}' /run/systemd/resolve/resolv.conf 2>/dev/null | grep -v '^127\.' | head -2)
          printf '%s\n' $ns 168.63.129.16 | python3 -c "import sys,json; print(json.dumps({'dns': [l.strip() for l in sys.stdin if l.strip()]}))" | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker run --rm ubuntu:24.04 getent hosts archive.ubuntu.com

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --provenance=false: a plain image manifest, as for the Lambda image.
      - name: Build and push
        run: |
          docker buildx build --provenance=false --sbom=false --push \
            -t ghcr.io/laurentcarrie/songbook-ci:latest \
            -t ghcr.io/laurentcarrie/songbook-ci:${{ github.sha }} \
            docker/ci
