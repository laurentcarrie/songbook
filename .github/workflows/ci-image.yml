name: Build the CI image

# Builds docker/ci/Dockerfile and pushes it to ghcr.io/laurentcarrie/songbook-ci, the container of the deploy job.
# Only when the Dockerfile changes (or by hand): the deploy job installs band-songbook and the chord fonts itself.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/ci/**'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # What a container resolves on this runner (information only, never fails): on the ubuntu-26.04 runner the build
      # containers did not resolve archive.ubuntu.com / security.ubuntu.com ("Temporary failure resolving") while the
      # registries and the host did; --network host and a DNS server in daemon.json did not change it.
      - name: Docker DNS diagnostics
        run: |
          docker run --rm ubuntu:24.04 sh -c 'grep -v "^#" /etc/resolv.conf; for h in archive.ubuntu.com security.ubuntu.com azure.archive.ubuntu.com ghcr.io; do if getent ahosts $h >/dev/null; then echo "$h: resolves"; else echo "$h: NO"; fi; done' || true

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --provenance=false: a plain image manifest, as for the Lambda image.
      # UBUNTU_MIRROR: the Azure mirror, the one the runner's own apt uses (see docker/ci/Dockerfile).
      - name: Build and push
        run: |
          docker buildx build --provenance=false --sbom=false --push \
            --build-arg UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu \
            -t ghcr.io/laurentcarrie/songbook-ci:latest \
            -t ghcr.io/laurentcarrie/songbook-ci:${{ github.sha }} \
            docker/ci
