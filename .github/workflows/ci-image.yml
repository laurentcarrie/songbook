name: Build the CI image

# Builds docker/ci/Dockerfile and pushes it to ghcr.io/laurentcarrie/songbook-ci, the container of the deploy job.
# Only when the Dockerfile changes (or by hand): the deploy job installs band-songbook and the chord fonts itself.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/ci/**'
      - '.github/workflows/ci-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --provenance=false: a plain image manifest, as for the Lambda image.
      # --network host: on the ubuntu-26.04 runner the build containers cannot resolve archive.ubuntu.com (the
      # registries resolve, the host too), so apt-get update fails; the host network uses the host's DNS.
      - name: Build and push
        run: |
          docker buildx build --network host --provenance=false --sbom=false --push \
            -t ghcr.io/laurentcarrie/songbook-ci:latest \
            -t ghcr.io/laurentcarrie/songbook-ci:${{ github.sha }} \
            docker/ci
