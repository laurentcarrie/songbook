# TODO: these anchors are PLACEHOLDERS. They must be measured against this
# song.mp3 before `has_clicks` is set to true in song.yml.
#
# Each entry pins one bar to a timestamp in the audio. You only anchor section
# starts - the build interpolates the beats in between using `tempo` from
# song.yml, so an accurate tempo matters as much as the anchors.
#
#   bar_number:          bar this anchor pins (1-based)
#   beat_in_bar_number:  beat within that bar, normally 1 (the downbeat)
#   time:                MM:SS.mmm into song.mp3
#   description:         free text, shown when debugging
#
# To verify once filled in:
#   make song song=stereophonics
#   ./test-clicks.sh songs/stereophonics/maybe-tomorrow
#   then play overlay.mp3 and check the clicks sit on the beat
#
# Anchors are bound to this exact audio file. Re-encoding or trimming
# song.mp3 shifts every timestamp - the build will still succeed, but the
# clicks will be silently wrong.
clicks:
- bar_number: 1
  beat_in_bar_number: 1
  time: 00:00.000
  description: bar 1 - intro
